[project]
name = "channels-webtransport"
version = "0.0.1"
description = "Experimental WebTransport support for Django Channels"
readme = "README.md"
authors = [
    { name = "Sayan Biswas", email = "sayan.biswas@youe.co" },
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "channels>=4.2,<5",
    "pywebtransport>=0.20.1,<0.21",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-django>=4.11",
    "ruff>=0.11",
    "types-channels>=4.2",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["channels_webtransport"]

[[tool.mypy.overrides]]
module = "channels_webtransport.testing"
disallow_untyped_calls = false
warn_return_any = false
